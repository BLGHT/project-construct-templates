---
- name: Setup Kali (install kasmvnc)
  hosts: all
  become_method: sudo
  tasks:
    # See: https://bugs.kali.org/view.php?id=9027
    - name: Install from python-apt from source if needed
      become: true
      ansible.builtin.shell:
        cmd: |
          apt update 2>&1 | grep 'undefined symbol: _ZNS' >/dev/null && \
            echo "Python-apt bug found, fixing from source..." >> /tmp/kali-install.log && \
            DEBIAN_FRONTEND=noninteractive apt install -y python3-setuptools dpkg-dev python3-dev libapt-pkg-dev >> /tmp/kali-install.log 2>&1 && \
            git clone https://salsa.debian.org/apt-team/python-apt >> /tmp/kali-install.log 2>&1 && cd python-apt && \
            git checkout 2.9.2 >> /tmp/kali-install.log 2>&1 && \
            python3 setup.py build >> /tmp/kali-install.log 2>&1 && \
            python3 setup.py install >> /tmp/kali-install.log 2>&1 || \
          echo "No python-apt bug found" >> /tmp/kali-install.log

    - name: Try an apt install
      become: true
      ansible.builtin.apt:
        name:
          - git
        state: present
        update_cache: true
      register: apt_result
      ignore_errors: true

    # This is a fix for the "python3-apt must be installed and visible from /usr/bin/python3" error in Kali 2024.4
    - name: Fix apt for ansible if needed
      become: true
      ansible.builtin.shell:
        cmd: |
          echo "Python-apt bug 2 found, fixing from source..." >> /tmp/kali-install.log && \
          DEBIAN_FRONTEND=noninteractive apt install -y python3-setuptools dpkg-dev python3-dev libapt-pkg-dev >> /tmp/kali-install.log 2>&1 && \
          git clone https://salsa.debian.org/apt-team/python-apt >> /tmp/kali-install.log 2>&1 && cd python-apt && \
          git checkout 2.9.6 >> /tmp/kali-install.log 2>&1 && \
          python3 setup.py build >> /tmp/kali-install.log 2>&1 && \
          python3 setup.py install >> /tmp/kali-install.log 2>&1
      when: apt_result.failed

    # Installed via apt-get directly rather than the apt module so that
    # --allow-downgrades is guaranteed to reach the command line, and split into
    # small named groups on purpose: the packer log truncates long error output,
    # but task names always survive, so a failure names the group that broke.
    # The rescue block then prints a short, log-safe error summary.
    - name: Install packages
      become: true
      block:
        - name: Install packages - base tools
          ansible.builtin.command:
            cmd: >-
              apt-get install -y -o Dpkg::Options::=--force-confold --allow-downgrades
              git python3-pip jq curl vim wget swapspace
          environment:
            DEBIAN_FRONTEND: noninteractive
          register: pkg_base
          retries: 2
          delay: 5
          until: pkg_base.rc == 0
          changed_when: "'0 newly installed' not in pkg_base.stdout"

        - name: Install packages - dbus
          ansible.builtin.command:
            cmd: >-
              apt-get install -y -o Dpkg::Options::=--force-confold --allow-downgrades
              dbus dbus-user-session dbus-x11
          environment:
            DEBIAN_FRONTEND: noninteractive
          register: pkg_dbus
          retries: 2
          delay: 5
          until: pkg_dbus.rc == 0
          changed_when: "'0 newly installed' not in pkg_dbus.stdout"

        # No OpenCL ICD is listed explicitly: kali-rolling has no
        # pocl-opencl-icd package, and naming it fails the whole install with
        # "has no installation candidate". hashcat depends on the virtual
        # opencl-icd, so apt pulls a provider in by itself.
        - name: Install packages - password cracking (hashcat, john, rockyou)
          ansible.builtin.command:
            cmd: >-
              apt-get install -y -o Dpkg::Options::=--force-confold --allow-downgrades
              hashcat john wordlists
          environment:
            DEBIAN_FRONTEND: noninteractive
          register: pkg_crack
          retries: 2
          delay: 5
          until: pkg_crack.rc == 0
          changed_when: "'0 newly installed' not in pkg_crack.stdout"

        - name: Install packages - kali base metapackages
          ansible.builtin.command:
            cmd: >-
              apt-get install -y -o Dpkg::Options::=--force-confold --allow-downgrades
              kali-defaults kali-root-login desktop-base
          environment:
            DEBIAN_FRONTEND: noninteractive
          register: pkg_kalibase
          retries: 2
          delay: 5
          until: pkg_kalibase.rc == 0
          changed_when: "'0 newly installed' not in pkg_kalibase.stdout"

        # Slowest step by far - kali-linux-core plus the XFCE desktop.
        - name: Install packages - kali core and XFCE desktop
          ansible.builtin.command:
            cmd: >-
              apt-get install -y -o Dpkg::Options::=--force-confold --allow-downgrades
              kali-linux-core kali-desktop-xfce
          environment:
            DEBIAN_FRONTEND: noninteractive
          register: pkg_desktop
          retries: 2
          delay: 5
          until: pkg_desktop.rc == 0
          changed_when: "'0 newly installed' not in pkg_desktop.stdout"

      rescue:
        # Print a compact summary so the real reason survives log truncation.
        - name: APT FAILURE - last error lines
          ansible.builtin.debug:
            msg: "{{ (ansible_failed_result.stderr_lines | default([]))[-6:] }}"

        - name: APT FAILURE - last output lines
          ansible.builtin.debug:
            msg: "{{ (ansible_failed_result.stdout_lines | default([]))[-12:] }}"

        - name: Stop the build after reporting the apt failure
          ansible.builtin.fail:
            msg: "apt install failed in task: {{ ansible_failed_task.name | default('unknown') }}"

    - name: Extract the rockyou.txt wordlist
      become: true
      ansible.builtin.shell:
        cmd: gunzip -k -f /usr/share/wordlists/rockyou.txt.gz
        creates: /usr/share/wordlists/rockyou.txt

    - name: Installing kasm dependencies
      become: true
      ansible.builtin.apt:
        autoremove: true
        state: present
        name:
          - libexporter-tiny-perl
          - libhash-merge-simple-perl
          - liblist-moreutils-perl
          - liblist-moreutils-xs-perl
          - libswitch-perl
          - libyaml-tiny-perl
          - ssl-cert

    - name: Download kasmvnc deb
      ansible.builtin.get_url:
        url: https://github.com/kasmtech/KasmVNC/releases/download/v1.4.0/kasmvncserver_kali-rolling_1.4.0_amd64.deb
        dest: /tmp/kasmvncserver_kali-rolling.deb
        mode: '0700'

    - name: Install the kasmvnc deb
      become: true
      ansible.builtin.apt:
        deb: /tmp/kasmvncserver_kali-rolling.deb
        state: present

    - name: Add Kali to the ssl-cert group
      become: true
      ansible.builtin.user:
        name: kali
        groups: ssl-cert
        append: true

    - name: Create .vnc directory for VNC user
      ansible.builtin.file:
        path: /home/kali/.vnc
        state: directory
        mode: '0755'
        owner: kali
        group: kali

    # Add a user to the vncserver, create a systemd service for it
    - name: Set the password for the kali user
      ansible.builtin.shell:
        cmd: |
          printf "password\npassword\n\n" | vncpasswd -u kali -ow /home/kali/.kasmpasswd

    - name: Set correct permissions for VNC passwd file
      ansible.builtin.file:
        path: /home/kali/.kasmpasswd
        owner: kali
        group: kali
        mode: '0600'

    - name: Set the de-was-selected file
      ansible.builtin.file:
        path: "/home/kali/.vnc/.de-was-selected"
        state: touch
        owner: kali
        group: kali
        mode: '0644'

    - name: Create xstartup script
      ansible.builtin.copy:
        dest: "/home/kali/.vnc/xstartup"
        force: false
        mode: '0755'
        content: |-
          #!/bin/bash
          exec xfce4-session

    - name: Deploy kasmvnc.yml config to user ~/.vnc
      ansible.builtin.blockinfile:
        path: "/home/kali/.vnc/kasmvnc.yaml"
        create: true
        block: |
          desktop:
            resolution:
              width: 1920
              height: 1080
            allow_resize: true
            pixel_depth: 24

          keyboard:
            remap_keys:
            ignore_numlock: false
            raw_keyboard: true

          user_session:
            idle_timeout: never

          server:
            auto_shutdown:
              no_user_session_timeout: never
              active_user_session_timeout: never
              inactive_user_session_timeout: never

          pointer:
            enabled: true

          security:
            brute_force_protection:
              blacklist_threshold: 0

    - name: Create a service for kasmvnc
      become: true
      ansible.builtin.blockinfile:
        path: /etc/systemd/system/kasmvnc@1.service
        create: true
        block: |
          [Unit]
          Description=Remote desktop service (VNC)
          After=syslog.target network.target
          StartLimitIntervalSec=30s
          StartLimitBurst=5

          [Service]
          Type=simple
          User=kali
          PIDFile=/home/kali/.vnc/%H%i.pid
          ExecStartPre=/bin/sh -c "/usr/bin/kasmvncserver -kill :%i > /dev/null 2>&1 || :"
          ExecStart=/usr/bin/kasmvncserver :%i -localhost no -alwaysshared -fg -geometry 1920x1080 -SecurityTypes VncAuth -PublicIP 127.0.0.1
          ExecStop=/usr/bin/kasmvncserver -kill :%i
          Restart=on-failure
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target

    - name: Enable the kasmvnc service
      become: true
      ansible.builtin.service:
        name: kasmvnc@1.service
        enabled: true
        daemon_reload: true
